services:
  - type: web
    name: monte-carlo-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FRED_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: monte-carlo-db
          property: connectionString

databases:
  - name: monte-carlo-db
    plan: free
    databaseName: monte_carlo
    user: monte_carlo_user
